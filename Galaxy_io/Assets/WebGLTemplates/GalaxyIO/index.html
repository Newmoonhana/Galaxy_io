<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* 창 전체를 게임 화면으로 씀 */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; width: 240px; transform: translate(-50%, -50%); }
      #loading-bar { height: 4px; background: #222; }
      #loading-fill { width: 0%; height: 100%; background: #4fd8ff; }
      #banner { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); font: 14px sans-serif; color: #000; }
      #banner div { margin-bottom: 4px; padding: 8px 12px; background: #ffd84f; }
      #banner div.error { background: #ff5f5f; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-bar"><div id="loading-fill"></div></div></div>
    <div id="banner"></div>
    <script>
      // 경고는 5초 뒤 사라짐. 에러는 계속 남김.
      function showBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        if (type == "error") div.className = "error";
        document.querySelector("#banner").appendChild(div);
        if (type != "error") setTimeout(function () { div.remove(); }, 5000);
      }

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        var canvas = document.querySelector("#unity-canvas");
        var loading = document.querySelector("#loading");
        var fill = document.querySelector("#loading-fill");

        createUnityInstance(canvas, {
          arguments: [],
#if PROGRESSIVE_ASSET_LOADING
          primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
          secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          showBanner: showBanner,
        }, function (progress) {
          fill.style.width = 100 * progress + "%";
        }).then(function () {
          loading.remove();
          canvas.focus();
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
